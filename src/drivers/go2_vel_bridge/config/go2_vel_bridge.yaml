go2_vel_bridge:
  ros__parameters:
    cmd_vel_topic: "/cmd_vel"
    cmd_out_topic: "/go2_vel_bridge/cmd_out"
    sport_request_topic: "/api/sport/request"
    max_vx: 0.6
    max_vy: 0.0
    max_vyaw: 1.2
    cmd_vel_timeout: 1.0
    publish_rate: 50.0
    stop_mode: "zero_velocity"
    max_linear_accel: 1.5
    max_angular_accel: 3.0
    # Straight-line: zero small vyaw while moving forward.
    forward_linear_threshold: 0.15
    forward_angular_deadband: 0.03
    # After in-place rotation: full stop (vx=0, vyaw=0) for settle_hold_time, then forward.
    wait_for_turn_settle: true
    turning_vyaw_threshold: 0.12
    rotating_linear_threshold: 0.08
    settle_hold_time: 0.25
    invert_angular_z: false
