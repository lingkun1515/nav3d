# Dog3DNav 导航栈统一参数配置
# 由各算法包配置文件合并而来，作为 navigation.launch.py 的单一配置入口。
# 来源: octo_planner/config/planner_params.yaml + local_planner/config/local_planner_params.yaml
# 手动更新某个包的参数后，请同步回其包内独立配置文件。

octo_planner_node:
  ros__parameters:
    # Map loading
    pcd_file: ""
    frame_id: "map"

    # Converter parameters
    resolution: 0.2
    min_points_per_voxel: 3
    min_cluster_voxels: 2
    enable_ground_infill: true
    ground_infill_neighbor_threshold: 3
    ground_infill_density_threshold: 0.02

    # Radical infill: bridge disconnected traversable regions
    radical_infill_enabled: true
    radical_infill_radius_m: 1.0
    radical_infill_clearance_m: 1.0
    radical_infill_half_height_m: 0.1

    # Preblocked cells as hard obstacles: when false, preblocked only affects
    # costmap (soft penalty), narrow gaps between small obstacles become traversable
    preblocked_hard_obstacle: true

    # Flatten noisy traversable surface via median filter on the 2D height map.
    # Only adjusts cells whose Z differs from the local median by <= max_delta.
    # Stairs/ramps (Z change > max_delta) are preserved.
    flatten_enabled: true
    flatten_window_cells: 5
    flatten_max_delta_cells: 1

    # Planner parameters
    robot_radius: 0.05
    max_iterations: 500000
    snap_search_radius_cells: 8
    require_ground_support: true
    strict_direct_ground_support: false
    ground_support_xy_radius_cells: 1
    ground_support_depth_cells: 1
    enable_preblocked_costmap: true
    preblocked_costmap_radius_cells: 3
    preblocked_costmap_weight: 2.5
    lowest_traversable_only: false

    # Publishing
    auto_publish_enabled: false
    octomap_publish_period_s: 5.0

    # Timer-driven periodic global re-planning (seconds, 0 = disabled)
    replan_period_s: 5.0

    # Auto-save: cache converted octomap as .bt alongside source file
    auto_save_bt: true
    # XY window for world/sdf loading (0 = no cropping)
    world_xy_window_size_m: 24.0

    # Online incremental OctoMap update from real-time point cloud
    online_update_enabled: true
    online_update_cloud_topic: "/lidar_points"
    online_update_period_s: 10.0
    online_update_occupied_prob: 0.7
    # Conservative mode: instead of updating the voxel at the hit point,
    # update the voxel behind along the sensor ray (inflates obstacles)
    online_update_use_raycasting: true
    online_update_conservative_mode: true
    online_update_min_interval_ms: 500
    online_update_downsample_step: 1
    online_update_max_xy_distance: 10.0
    online_update_max_z_above: 5.0
    online_update_max_z_below: 5.0
    # Miss probability for raycasting clear pass (lower = more aggressive clearing).
    # Default 0.15 gives log-odds ≈ -1.74 per ray vs tree default 0.4 (-0.41).
    online_update_ray_clear_prob_miss: 0.15

latticePlanner:
  ros__parameters:
    # pathFolder is set by launch (dynamic, based on install share dir)

    # Vehicle geometry
    vehicleLength: 0.4
    vehicleWidth: 0.3
    vehicleLengthSlot: 0.05
    vehicleWidthMargin: 0.05
    marginYawRateRatio: 0.0
    twoWayDrive: false

    # Perception
    laserVoxelSize: 0.1
    terrainVoxelSize: 0.2
    useTerrainAnalysis: false
    checkObstacle: true
    checkRotObstacle: false
    adjacentRange: 3.5
    obstacleHeightThre: 0.2
    groundHeightThre: 0.1
    costHeightThre1: 0.2
    costHeightThre2: 0.1
    useCost: false

    # Path scoring
    slowPathNumThre: 5
    slowGroupNumThre: 1
    surPointThre: 6
    pointPerPathThre: 18
    minRelZ: 0.1
    maxRelZ: 0.8
    maxSpeed: 0.5
    dirWeight: 0.02
    dirThre: 90.0
    dirToVehicle: false
    pathScale: 1.0
    minPathScale: 0.75
    pathScaleStep: 0.25
    pathScaleBySpeed: true
    minPathRange: 1.0
    pathRangeStep: 0.5
    pathRangeBySpeed: true
    pathCropByGoal: false

    # Autonomy
    autonomyMode: true
    autonomySpeed: 0.5
    joyToSpeedDelay: 2.0
    joyToCheckObstacleDelay: 5.0
    freezeAng: 90.0
    freezeTime: 2.0
    omniDirGoalThre: 1.0
    goalClearRange: 0.5
    goalBehindRange: 0.8

    # TF / input configuration
    global_frame_id: "map"
    use_planned_path: true
    use_laser_scan: false
    waypoint_lookahead: 2.5
    waypoint_tolerance: 0.5

pathFollower:
  ros__parameters:
    # Hardware
    realRobot: false
    serialPort: "/dev/ttyACM0"
    baudrate: 115200
    pubSkipNum: 1

    # Drive mode
    twoWayDrive: false

    # Pure-pursuit
    lookAheadDis: 0.5

    # Controller gains
    yawRateGain: 2.5
    stopYawRateGain: 2.5
    maxYawRate: 45.0
    maxSpeed: 0.3
    maxAccel: 0.5
    switchTimeThre: 1.0
    dirDiffThre: 0.1
    omniDirGoalThre: 1.0
    omniDirDiffThre: 1.5
    stopDisThre: 0.2
    slowDwnDisThre: 1.0

    # Incline handling
    useInclRateToSlow: false
    inclRateThre: 120.0
    slowRate1: 0.25
    slowRate2: 0.5
    slowRate3: 0.75
    slowTime1: 2.0
    slowTime2: 2.0
    useSideAvoid: false
    useInclToStop: false
    inclThre: 45.0
    stopTime: 5.0
    noRotAtStop: false
    noRotAtGoal: true
    cmdVelTimeout: 0.2

    # Global-path mode (bypass latticePlanner, direct /planned_path → /cmd_vel)
    use_global_path: true
    waypoint_lookahead: 2.5
    waypoint_tolerance: 0.5

    # Autonomy
    autonomyMode: true
    autonomySpeed: 0.5
    joyToSpeedDelay: 2.0
