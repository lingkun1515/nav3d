latticePlanner:
  ros__parameters:
    pathFolder: ""

    # Vehicle geometry
    vehicleLength: 0.4
    vehicleWidth: 0.3
    vehicleLengthSlot: 0.05
    vehicleWidthMargin: 0.05
    marginYawRateRatio: 0.0
    twoWayDrive: false

    # Perception
    laserVoxelSize: 0.05
    terrainVoxelSize: 0.2
    useTerrainAnalysis: false
    checkObstacle: true
    checkRotObstacle: false
    adjacentRange: 3.5
    obstacleHeightThre: 0.2
    groundHeightThre: 0.1
    costHeightThre1: 0.2
    costHeightThre2: 0.1
    useCost: false

    # Path scoring
    slowPathNumThre: 5
    slowGroupNumThre: 1
    surPointThre: 6
    pointPerPathThre: 6
    minRelZ: 0.1
    maxRelZ: 0.8
    maxSpeed: 1.0
    dirWeight: 0.02
    dirThre: 90.0
    dirToVehicle: false
    pathScale: 1.0
    minPathScale: 0.75
    pathScaleStep: 0.25
    pathScaleBySpeed: true
    minPathRange: 1.0
    pathRangeStep: 0.5
    pathRangeBySpeed: true
    pathCropByGoal: false

    # Autonomy
    autonomyMode: true
    autonomySpeed: 1.0
    joyToSpeedDelay: 2.0
    joyToCheckObstacleDelay: 5.0
    freezeAng: 90.0
    freezeTime: 2.0
    omniDirGoalThre: 1.0
    goalClearRange: 0.5
    goalBehindRange: 0.8
    # TF / input configuration
    global_frame_id: "map"
    use_planned_path: false
    use_laser_scan: false
    waypoint_lookahead: 2.5
    waypoint_tolerance: 0.5

nav2CostmapPlanner:
  ros__parameters:
    # Vehicle geometry
    vehicleLength: 0.4
    vehicleWidth: 0.3
    vehicleLengthSlot: 0.05
    vehicleWidthMargin: 0.05
    twoWayDrive: false
    maxSpeed: 1.0

    # Obstacle / cost thresholds
    adjacentRange: 3.5
    obstacleHeightThre: 0.2
    groundHeightThre: 0.1
    costHeightThre1: 0.2
    costHeightThre2: 0.1
    useCost: false

    # Path scoring
    slowPathNumThre: 5
    surPointThre: 6
    pointPerPathThre: 6
    minRelZ: 0.1
    maxRelZ: 0.8
    dirWeight: 0.02
    dirThre: 90.0
    dirToVehicle: false
    pathScale: 1.0
    minPathScale: 0.75
    pathScaleStep: 0.25
    pathScaleBySpeed: true
    minPathRange: 1.0
    pathRangeStep: 0.5
    pathRangeBySpeed: true
    pathCropByGoal: false
    omniDirGoalThre: 1.0
    goalClearRange: 0.5
    goalBehindRange: 0.8

    # Autonomy
    autonomyMode: false
    autonomySpeed: 1.0
    joyToSpeedDelay: 2.0
    joyToCheckObstacleDelay: 5.0
    freezeAng: 90.0
    freezeTime: 2.0

    # TF / input
    global_frame_id: "map"
    use_planned_path: true
    waypoint_lookahead: 2.5
    waypoint_tolerance: 0.5

    # Costmap planner specific
    num_lateral_candidates: 15
    lateral_step: 0.1
    lookahead_distance: 2.5
    costmap_score_threshold: 200.0
    lethal_obstacle_cost_threshold: 5.0

costmap:
  ros__parameters:
    global_frame: "map"
    robot_base_frame: "base_link"
    update_frequency: 10.0
    publish_frequency: 5.0
    transform_tolerance: 0.3
    resolution: 0.05
    footprint: "[[-0.2, -0.15], [0.35, -0.15], [0.35, 0.15], [-0.2, 0.15]]"
    robot_radius: 0.25
    footprint_padding: 0.02
    rolling_window: true
    width: 8
    height: 8
    track_unknown_space: false
    always_send_full_costmap: true
    plugins: ["voxel_layer", "inflation_layer"]
    voxel_layer:
      plugin: "nav2_costmap_2d::VoxelLayer"
      enabled: true
      footprint_clearing_enabled: false
      max_obstacle_height: 2.0
      z_voxels: 20
      z_resolution: 0.1
      origin_z: 0.0
      unknown_threshold: 15
      mark_threshold: 0
      publish_voxel_map: false
      observation_sources: "lidar_cloud"
      combination_method: 1
      lidar_cloud:
        topic: "/lidar_points"
        sensor_frame: "lidar_link"
        data_type: "PointCloud2"
        expected_update_rate: 0.1
        observation_persistence: 0.5
        marking: true
        clearing: false
        max_obstacle_height: 2.0
        min_obstacle_height: 0.05
        obstacle_max_range: 3.5
        obstacle_min_range: 0.0
        raytrace_max_range: 3.5
        raytrace_min_range: 0.0
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      enabled: true
      inflation_radius: 0.35
      cost_scaling_factor: 5.0
      inflate_unknown: false
      inflate_around_unknown: false

pathFollower:
  ros__parameters:
    # Hardware
    realRobot: false
    serialPort: "/dev/ttyACM0"
    baudrate: 115200
    pubSkipNum: 1

    # Drive mode
    twoWayDrive: false

    # Pure-pursuit
    lookAheadDis: 0.5

    # Controller gains
    yawRateGain: 7.5
    stopYawRateGain: 7.5
    maxYawRate: 45.0
    maxSpeed: 1.0
    maxAccel: 1.0
    switchTimeThre: 1.0
    dirDiffThre: 0.1
    omniDirGoalThre: 1.0
    omniDirDiffThre: 1.5
    stopDisThre: 0.2
    slowDwnDisThre: 1.0

    # Incline handling
    useInclRateToSlow: false
    inclRateThre: 120.0
    slowRate1: 0.25
    slowRate2: 0.5
    slowRate3: 0.75
    slowTime1: 2.0
    slowTime2: 2.0
    useSideAvoid: false
    useInclToStop: false
    inclThre: 45.0
    stopTime: 5.0
    noRotAtStop: false
    noRotAtGoal: true
    cmdVelTimeout: 0.2

    # Autonomy
    autonomyMode: false
    autonomySpeed: 1.0
    joyToSpeedDelay: 2.0
